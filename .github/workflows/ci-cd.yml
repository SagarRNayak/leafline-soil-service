name: Leafline Soil Service CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deployment/**'
      - 'docker-compose.yml'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'

jobs:
  # ==============================================================
  # STAGE 1: BACKEND TESTING & CODE VERIFICATION
  # ==============================================================
  backend-tests:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest test suite
        env:
          PYTHONPATH: .
          MOCK_AUTH_MODE: "true"
          ENVIRONMENT: "development"
        run: |
          python -m pytest backend/tests -v --junitxml=backend-test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend-test-results.xml

  # ==============================================================
  # STAGE 2: FRONTEND BUILD & ASSET VERIFICATION
  # ==============================================================
  frontend-build:
    name: Frontend Vite Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend bundle
        working-directory: ./frontend
        run: npm run build

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # ==============================================================
  # STAGE 3: DOCKER CONTAINER IMAGE BUILDS
  # ==============================================================
  docker-build:
    name: Build & Verify Docker Images
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile.api
          push: false
          tags: leafline-soil-backend:latest

      - name: Build Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile.worker
          push: false
          tags: leafline-soil-worker:latest

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile.frontend
          push: false
          tags: leafline-soil-frontend:latest

  # ==============================================================
  # STAGE 4: DEPLOY TO AWS EC2 (MAIN BRANCH ONLY)
  # ==============================================================
  deploy-aws-ec2:
    name: Deploy to AWS EC2 & RDS
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "[INFO] Deploying Leafline Soil Service..."
            cd /home/ubuntu/leafline-soil-service
            
            # Pull latest code
            git pull origin main
            
            # Run database migrations
            docker compose run --rm backend alembic -c backend/alembic.ini upgrade head
            
            # Rebuild and restart containers with zero downtime rolling update
            docker compose up -d --build --remove-orphans
            
            # Health check validation
            sleep 10
            curl -f http://localhost/health || (echo "[ERROR] Health check failed! Rolling back..." && docker compose rollback && exit 1)
            echo "[SUCCESS] Deployment to AWS verified successfully."
